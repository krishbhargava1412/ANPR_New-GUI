# Docker Compose for ANPR DRDO Server (Tier 1: Single Node)
# Run: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anpr
      POSTGRES_USER: anpr
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-anpr_secure_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpr"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: anpr
      DATABASE_USER: anpr
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-anpr_secure_2026}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      EDGE_API_KEY: ${EDGE_API_KEY:-edge-jetson-key-change-in-prod}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      CORS_ORIGINS: "*"
      SNAPSHOTS_DIR: /app/data/snapshots
      LOG_LEVEL: INFO
    volumes:
      - snapshots:/app/data/snapshots
    restart: unless-stopped

volumes:
  pg_data:
  snapshots:
